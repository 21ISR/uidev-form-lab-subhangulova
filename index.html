<body>
    <div class="continer">
        <main>
            <header>
                <h1>Student Login</h1>
                <p>Access your student account</p>

            <form action="/api/login" method="post">
                <label for="Email">Email or student ID</label>
                <input type="email" id="email" name="email" placeholder="Enter your email or student ID">

                <label>
                    <input type="checkbox" name="Remember" checked>
                    Remember me

            </form>
